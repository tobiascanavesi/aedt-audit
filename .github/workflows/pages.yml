name: Web app (GitHub Pages)

# Publishes web/index.html together with a wheel built from this commit, so the
# browser app always runs the same code as the repository. Enable Pages once in
# the repository settings (Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist
      - name: Assemble the site
        run: |
          mkdir -p site
          cp web/index.html site/
          cp dist/*.whl site/
          WHEEL=$(basename dist/*.whl)
          VERSION=$(echo "$WHEEL" | cut -d- -f2)
          printf '{"wheel": "%s", "version": "%s"}\n' "$WHEEL" "$VERSION" > site/wheel.json
          touch site/.nojekyll
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
